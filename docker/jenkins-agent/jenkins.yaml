jenkins:
  systemMessage: "Jenkins configured as code"
  numExecutors: 2

  authorizationStrategy: "loggedInUsersCanDoAnything"
  securityRealm:
    local:
      allowsSignup: false  # Correct indentation

jobs:
  - script: |
      folder('test-folder1') {
        displayName('Test Folder1')
        description('Folder created programmatically using JCasC')
      }

      pipelineJob('test-folder1/test-job') {
        definition {
          cps {
            script('''
              pipeline {
                agent any
                stages {
                  stage('Test') {
                    steps {
                      echo 'This is a test pipeline'
                    }
                  }
                }
              }
            ''')
            sandbox()
          }
        }
      }
